name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-lock.txt
      - name: Install verified dependencies
        run: python -m pip install -r backend/requirements-lock.txt
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Lint backend
        run: python -m ruff check backend
      - name: Check backend formatting
        run: python -m ruff format --check backend
      - name: Test backend
        run: python -m pytest backend/tests -q --disable-plugin-autoload

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check frontend formatting
        run: npm run format:check
      - name: Test frontend
        run: npm test
      - name: Build frontend
        run: npm run build
