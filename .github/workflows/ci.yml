name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements-lock.txt
            backend/requirements-operator.txt
      - name: Install verified dependencies
        run: python -m pip install -r backend/requirements-lock.txt -r backend/requirements-operator.txt
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Lint backend
        run: python -m ruff check backend scripts/cloud scripts/monitoring scripts/portfolio scripts/optimization
      - name: Check backend formatting
        run: python -m ruff format --check backend scripts/cloud scripts/monitoring scripts/portfolio scripts/optimization
      - name: Verify browser model and preview exports
        run: python -m scripts.portfolio.export_iris --check
      - name: Test backend
        run: python -m pytest backend/tests -q --disable-plugin-autoload
      - name: Render representative owner monitoring configurations offline
        run: |
          python - <<'PY'
          from pathlib import Path
          from backend.app.iris_target import RuntimeTarget
          from scripts.cloud.runtime_manifests import render_runtime
          registry = '123456789012.dkr.ecr.us-east-1.amazonaws.com/strawhats-midterm/'
          for kind in ('eks', 'rehearsal'):
              cloud = kind == 'eks'
              target = RuntimeTarget(kind, 'arn:aws:eks:us-east-1:123456789012:cluster/strawhats-midterm' if cloud else 'docker-desktop', 'strawhats', 'strawhats-monitoring', 'iris', registry + 'iris@sha256:' + 'a' * 64 if cloud else 'strawhats-iris:rehearsal-1234567', 'IfNotPresent' if cloud else 'Never', 'strawhats-model-operator', registry + 'operator@sha256:' + 'b' * 64 if cloud else 'strawhats-model-operator:rehearsal-1234567')
              document = next(d for d in render_runtime(target).documents if d['kind'] == 'ConfigMap' and d['metadata']['name'] == 'prometheus-config')
              folder = Path('.local/ci-monitoring') / kind
              folder.mkdir(parents=True, exist_ok=True)
              for name, value in document['data'].items():
                  (folder / name).write_text(value)
          PY
      - name: Validate generated owner monitoring configurations and alert behavior
        run: |
          for kind in eks rehearsal; do
            docker run --rm --network none --entrypoint /bin/promtool --mount "type=bind,source=$PWD/.local/ci-monitoring/$kind,target=/etc/prometheus,readonly" prom/prometheus:v3.15.0 check config --syntax-only /etc/prometheus/prometheus.yaml
            docker run --rm --network none --entrypoint /bin/promtool --mount "type=bind,source=$PWD/.local/ci-monitoring/$kind,target=/etc/prometheus,readonly" --mount "type=bind,source=$PWD/infra/kubernetes/monitoring/tests,target=/tests,readonly" prom/prometheus:v3.15.0 test rules /tests/iris-alerts.test.yaml
          done

  monitoring:
    name: Monitoring configuration and alert rules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Validate Prometheus configuration
        run: >-
          docker run --rm --network none --entrypoint /bin/promtool
          --mount "type=bind,source=$PWD/infra/kubernetes/monitoring/configs,target=/etc/prometheus,readonly"
          prom/prometheus:v3.15.0 check config --syntax-only /etc/prometheus/prometheus.yaml
      - name: Test actual alert behavior
        run: >-
          docker run --rm --network none --entrypoint /bin/promtool
          --mount "type=bind,source=$PWD/infra/kubernetes/monitoring/configs,target=/etc/prometheus,readonly"
          --mount "type=bind,source=$PWD/infra/kubernetes/monitoring/tests,target=/tests,readonly"
          prom/prometheus:v3.15.0 test rules /tests/iris-alerts.test.yaml

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check frontend formatting
        run: npm run format:check
      - name: Test frontend
        run: npm test
      - name: Build connected workspace
        run: npm run build
        env:
          VITE_APP_MODE: workspace
          VITE_API_BASE_URL: ""
      - name: Build standalone portfolio
        run: npm run build
        env:
          VITE_APP_MODE: portfolio
          VITE_API_BASE_URL: ""
