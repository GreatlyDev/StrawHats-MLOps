name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements-lock.txt
            backend/requirements-operator.txt
      - name: Install verified dependencies
        run: python -m pip install -r backend/requirements-lock.txt -r backend/requirements-operator.txt
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Lint backend
        run: python -m ruff check backend scripts/cloud scripts/monitoring
      - name: Check backend formatting
        run: python -m ruff format --check backend scripts/cloud scripts/monitoring
      - name: Test backend
        run: python -m pytest backend/tests -q --disable-plugin-autoload

  monitoring:
    name: Monitoring configuration and alert rules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Validate Prometheus configuration
        run: >-
          docker run --rm --network none --entrypoint /bin/promtool
          --mount "type=bind,source=$PWD/infra/kubernetes/monitoring/configs,target=/etc/prometheus,readonly"
          prom/prometheus:v3.15.0 check config --syntax-only /etc/prometheus/prometheus.yaml
      - name: Test actual alert behavior
        run: >-
          docker run --rm --network none --entrypoint /bin/promtool
          --mount "type=bind,source=$PWD/infra/kubernetes/monitoring/configs,target=/etc/prometheus,readonly"
          --mount "type=bind,source=$PWD/infra/kubernetes/monitoring/tests,target=/tests,readonly"
          prom/prometheus:v3.15.0 test rules /tests/iris-alerts.test.yaml

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check frontend formatting
        run: npm run format:check
      - name: Test frontend
        run: npm test
      - name: Build frontend
        run: npm run build
