AWSTemplateFormatVersion: '2010-09-09'
Description: StrawHats short-lived EKS and one Iris worker; no NAT or load balancer.
Parameters:
  ClusterName:
    Type: String
    Default: strawhats-midterm
    AllowedValues: [strawhats-midterm]
  KubernetesVersion:
    Type: String
    Default: '1.35'
    AllowedValues: ['1.35']
  OwnerPrincipalArn:
    Type: String
    AllowedPattern: 'arn:aws:iam::[0-9]{12}:(user|role)/[^\s]+'
  AdminCidr:
    Type: String
    AllowedPattern: '([0-9]{1,3}\.){3}[0-9]{1,3}/32'
  AvailabilityZoneA:
    Type: AWS::EC2::AvailabilityZone::Name
  AvailabilityZoneB:
    Type: AWS::EC2::AvailabilityZone::Name
Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.72.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{Key: Project, Value: StrawHats-MLOps}, {Key: Milestone, Value: one}]
  InternetGateway:
    Type: AWS::EC2::InternetGateway
  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
  InternetRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
  SubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.72.0.0/24
      AvailabilityZone: !Ref AvailabilityZoneA
      MapPublicIpOnLaunch: true
  SubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.72.1.0/24
      AvailabilityZone: !Ref AvailabilityZoneB
      MapPublicIpOnLaunch: true
  RouteAssociationA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref SubnetA
      RouteTableId: !Ref PublicRouteTable
  RouteAssociationB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref SubnetB
      RouteTableId: !Ref PublicRouteTable
  ClusterRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ClusterName}-cluster'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: eks.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns: [!Sub 'arn:${AWS::Partition}:iam::aws:policy/AmazonEKSClusterPolicy']
  NodeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ClusterName}-node'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ec2.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/AmazonEKSWorkerNodePolicy'
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/AmazonEC2ContainerRegistryPullOnly'
  CniRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ClusterName}-cni'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: pods.eks.amazonaws.com}
            Action: [sts:AssumeRole, sts:TagSession]
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
                aws:RequestTag/kubernetes-namespace: kube-system
                aws:RequestTag/kubernetes-service-account: aws-node
              ArnEquals:
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:eks:${AWS::Region}:${AWS::AccountId}:cluster/${ClusterName}'
      ManagedPolicyArns: [!Sub 'arn:${AWS::Partition}:iam::aws:policy/AmazonEKS_CNI_Policy']
  Cluster:
    Type: AWS::EKS::Cluster
    Properties:
      Name: !Ref ClusterName
      Version: !Ref KubernetesVersion
      RoleArn: !GetAtt ClusterRole.Arn
      BootstrapSelfManagedAddons: false
      AccessConfig:
        AuthenticationMode: API
        BootstrapClusterCreatorAdminPermissions: false
      UpgradePolicy: {SupportType: STANDARD}
      ResourcesVpcConfig:
        SubnetIds: [!Ref SubnetA, !Ref SubnetB]
        EndpointPrivateAccess: true
        EndpointPublicAccess: true
        PublicAccessCidrs: [!Ref AdminCidr]
      KubernetesNetworkConfig: {IpFamily: ipv4}
      Tags: [{Key: Project, Value: StrawHats-MLOps}, {Key: Milestone, Value: one}]
  OwnerAccess:
    Type: AWS::EKS::AccessEntry
    Properties:
      ClusterName: !Ref Cluster
      PrincipalArn: !Ref OwnerPrincipalArn
      Type: STANDARD
      AccessPolicies:
        - PolicyArn: arn:aws:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy
          AccessScope: {Type: cluster}
  PodIdentityAgent:
    Type: AWS::EKS::Addon
    Properties:
      ClusterName: !Ref Cluster
      AddonName: eks-pod-identity-agent
      ResolveConflicts: OVERWRITE
  VpcCni:
    Type: AWS::EKS::Addon
    DependsOn: PodIdentityAgent
    Properties:
      ClusterName: !Ref Cluster
      AddonName: vpc-cni
      ResolveConflicts: OVERWRITE
      PodIdentityAssociations:
        - RoleArn: !GetAtt CniRole.Arn
          ServiceAccount: aws-node
  NodeLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub '${ClusterName}-worker'
      LaunchTemplateData:
        CreditSpecification: {CpuCredits: standard}
        MetadataOptions:
          HttpEndpoint: enabled
          HttpTokens: required
          HttpPutResponseHopLimit: 1
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs: {VolumeSize: 20, VolumeType: gp3, Encrypted: true, DeleteOnTermination: true}
        TagSpecifications:
          - ResourceType: instance
            Tags: [{Key: Project, Value: StrawHats-MLOps}, {Key: Milestone, Value: one}]
          - ResourceType: volume
            Tags: [{Key: Project, Value: StrawHats-MLOps}, {Key: Milestone, Value: one}]
  NodeGroup:
    Type: AWS::EKS::Nodegroup
    DependsOn: [VpcCni, OwnerAccess, InternetRoute, RouteAssociationA, RouteAssociationB]
    Properties:
      ClusterName: !Ref Cluster
      NodegroupName: iris-worker
      NodeRole: !GetAtt NodeRole.Arn
      Subnets: [!Ref SubnetA, !Ref SubnetB]
      InstanceTypes: [t3.medium]
      CapacityType: ON_DEMAND
      AmiType: AL2023_x86_64_STANDARD
      ScalingConfig: {MinSize: 1, DesiredSize: 1, MaxSize: 1}
      LaunchTemplate:
        Id: !Ref NodeLaunchTemplate
        Version: !GetAtt NodeLaunchTemplate.LatestVersionNumber
      Tags: {Project: StrawHats-MLOps, Milestone: one}
  CoreDns:
    Type: AWS::EKS::Addon
    DependsOn: NodeGroup
    Properties:
      ClusterName: !Ref Cluster
      AddonName: coredns
      ResolveConflicts: OVERWRITE
  KubeProxy:
    Type: AWS::EKS::Addon
    DependsOn: NodeGroup
    Properties:
      ClusterName: !Ref Cluster
      AddonName: kube-proxy
      ResolveConflicts: OVERWRITE
  ImageRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub '${ClusterName}/iris'
      ImageTagMutability: IMMUTABLE
      EmptyOnDelete: false
      EncryptionConfiguration: {EncryptionType: AES256}
      Tags: [{Key: Project, Value: StrawHats-MLOps}, {Key: Milestone, Value: one}]
  OperatorImageRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub '${ClusterName}/operator'
      ImageTagMutability: IMMUTABLE
      EmptyOnDelete: false
      EncryptionConfiguration: {EncryptionType: AES256}
      Tags: [{Key: Project, Value: StrawHats-MLOps}, {Key: Milestone, Value: one}]
Outputs:
  ClusterArn: {Value: !GetAtt Cluster.Arn}
  ClusterName: {Value: !Ref Cluster}
  RepositoryUri: {Value: !GetAtt ImageRepository.RepositoryUri}
  RepositoryName: {Value: !Ref ImageRepository}
  VpcId: {Value: !Ref Vpc}
  OperatorRepositoryUri: {Value: !GetAtt OperatorImageRepository.RepositoryUri}
  OperatorRepositoryName: {Value: !Ref OperatorImageRepository}
