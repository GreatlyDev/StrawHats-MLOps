apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: modeldeployments.mlops.strawhats.dev
  labels:
    app.kubernetes.io/part-of: strawhats-mlops
spec:
  group: mlops.strawhats.dev
  scope: Namespaced
  names:
    plural: modeldeployments
    singular: modeldeployment
    kind: ModelDeployment
    shortNames: [md]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
        scale:
          specReplicasPath: .spec.replicas
          statusReplicasPath: .status.replicas
          labelSelectorPath: .status.selector
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Ready
          type: integer
          jsonPath: .status.readyReplicas
        - name: Replicas
          type: integer
          jsonPath: .spec.replicas
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [image]
              properties:
                mode:
                  type: string
                  enum: [Deploy, Rollback]
                  default: Deploy
                image: &image
                  type: string
                  minLength: 1
                  pattern: '^\S+$'
                imagePullPolicy: &policy
                  type: string
                  enum: [Never, IfNotPresent]
                  default: Never
                replicas: &replicas
                  type: integer
                  minimum: 1
                  maximum: 2
                  default: 1
                cpuMillicores: &cpu
                  type: integer
                  minimum: 100
                  maximum: 500
                  default: 250
                memoryMi: &memory
                  type: integer
                  minimum: 128
                  maximum: 512
                  default: 256
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                phase:
                  type: string
                  enum: [Pending, Ready, Failed, RolledBack, Conflict]
                replicas:
                  type: integer
                  minimum: 0
                readyReplicas:
                  type: integer
                  minimum: 0
                image:
                  type: string
                selector:
                  type: string
                lastReadySpec:
                  type: object
                  required: [image, imagePullPolicy, replicas, cpuMillicores, memoryMi]
                  properties:
                    image: *image
                    imagePullPolicy: *policy
                    replicas: *replicas
                    cpuMillicores: *cpu
                    memoryMi: *memory
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status, reason, message]
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ['True', 'False', Unknown]
                      reason:
                        type: string
                      message:
                        type: string
