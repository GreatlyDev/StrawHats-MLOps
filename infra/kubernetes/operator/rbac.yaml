apiVersion: v1
kind: ServiceAccount
metadata:
  name: strawhats-model-operator
  namespace: strawhats-operator-local
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: strawhats-model-operator
  namespace: strawhats-operator-local
rules:
  - apiGroups: [mlops.strawhats.dev]
    resources: [modeldeployments]
    verbs: [get, list]
  - apiGroups: [mlops.strawhats.dev]
    resources: [modeldeployments/status]
    verbs: [get, patch, update]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, create, patch, update]
  - apiGroups: ['']
    resources: [services]
    verbs: [get, list, create, patch, update]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list]
  - apiGroups: ['']
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: strawhats-model-operator
  namespace: strawhats-operator-local
subjects:
  - kind: ServiceAccount
    name: strawhats-model-operator
    namespace: strawhats-operator-local
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: strawhats-model-operator
