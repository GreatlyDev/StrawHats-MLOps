apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: strawhats-monitoring-local
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: strawhats-prometheus-discovery
  namespace: strawhats-operator-local
rules:
  - apiGroups: ['']
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: strawhats-prometheus-discovery
  namespace: strawhats-operator-local
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: strawhats-monitoring-local
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: strawhats-prometheus-discovery
