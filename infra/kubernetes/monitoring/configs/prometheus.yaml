global:
  scrape_interval: 10s
  scrape_timeout: 5s
  evaluation_interval: 10s
rule_files: [/etc/prometheus/iris-alerts.yaml]
scrape_configs:
  - job_name: iris-model
    metrics_path: /metrics
    scheme: http
    follow_redirects: false
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [strawhats-operator-local]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_phase]
        regex: Running
        action: keep
      - source_labels: [__meta_kubernetes_pod_controller_kind, __meta_kubernetes_pod_controller_name]
        regex: 'ReplicaSet;iris-[a-z0-9]+'
        action: keep
      - source_labels: [__meta_kubernetes_pod_label_mlops_strawhats_dev_owner_uid]
        regex: '.+'
        action: keep
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        regex: 'true'
        action: keep
      - source_labels: [__meta_kubernetes_pod_container_name, __meta_kubernetes_pod_container_port_name, __meta_kubernetes_pod_container_port_number]
        regex: 'iris;http;8000'
        action: keep
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - source_labels: [__meta_kubernetes_pod_container_image]
        target_label: image
