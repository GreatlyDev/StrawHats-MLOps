apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics-server
  namespace: kube-system
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: metrics-server
          resources:
            requests: {cpu: 100m, memory: 200Mi}
            limits: {cpu: 250m, memory: 256Mi}
