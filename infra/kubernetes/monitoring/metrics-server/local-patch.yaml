apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics-server
  namespace: kube-system
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: metrics-server
          # Docker Desktop kubelet certificate has no IP SAN; local testing only.
          args:
            - --cert-dir=/tmp
            - --secure-port=10250
            - --kubelet-preferred-address-types=InternalIP,ExternalIP,Hostname
            - --kubelet-use-node-status-port
            - --metric-resolution=15s
            - --kubelet-insecure-tls
          resources:
            requests: {cpu: 100m, memory: 200Mi}
            limits: {cpu: 250m, memory: 256Mi}
